name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish exact version to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)" != "${package_version}" ]]; then
            npm publish --access public --provenance
          fi

          for attempt in {1..12}; do
            published_version=""
            if published_version="$(npm view "${package_name}@${package_version}" version --prefer-online 2>/dev/null)" \
              && [[ "${published_version}" == "${package_version}" ]]; then
              exit 0
            fi

            if [[ "${attempt}" -eq 12 ]]; then
              echo "${package_name}@${package_version} was not queryable after publication" >&2
              exit 1
            fi

            sleep 10
          done
